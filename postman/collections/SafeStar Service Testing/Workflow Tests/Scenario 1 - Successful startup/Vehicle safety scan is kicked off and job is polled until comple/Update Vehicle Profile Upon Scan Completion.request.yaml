$kind: http-request
url: "{{baseUrl}}/vehicle/:id"
method: PATCH
headers:
  x-mock-response-code: "200"
pathVariables:
  id: "{{vehicleID}}"
body:
  type: json
  content: |-
    {
        "newCode": false
    }
auth:
  type: jwt
  credentials:
    isSecretBase64Encoded: true
    secret: "{{jwtSecret}}"
    algorithm: HS256
    payload: "{}"
    addTokenTo: header
    headerPrefix: Bearer
    queryParamKey: token
    header: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Response time is less than 600ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(600);
      });
    language: text/javascript
order: 3000
